<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Native Player | المشغل السينمائي المباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #0b1528, #040814, #000000);
        }
        .glass-card {
            background: rgba(13, 22, 42, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 antialiased">

    <div class="glass-card w-full max-w-2xl rounded-3xl p-8 shadow-2xl relative z-10 border border-slate-800">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-cyan-400 via-teal-300 to-blue-500 bg-clip-text text-transparent">Direct Stream Hub</h1>
            <p class="text-xs text-slate-400 mt-1">بث فوري مباشر داخل المتصفح بضغطة زر واحدة</p>
        </div>

        <div id="videoContainer" class="hidden mb-6 overflow-hidden rounded-2xl border border-cyan-500/30 bg-black shadow-2xl">
            <video id="video" controls class="w-full aspect-video" autoplay></video>
        </div>

        <div class="space-y-4" dir="ltr">
            <div>
                <label class="block text-xs font-semibold text-cyan-400 mb-1 text-left">Target Video URL</label>
                <div class="relative">
                    <input type="text" id="url" placeholder="Paste video link here..." 
                           class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-cyan-500 text-sm">
                    <button id="loadBtn" onclick="loadVideo()" class="absolute right-2 top-2 bottom-2 bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-xs px-5 rounded-lg active:scale-95 transition-all">
                        Load
                    </button>
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-xs font-semibold text-blue-400 text-left">Stream Quality</label>
                <select id="qualities" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3.5 text-white appearance-none focus:outline-none focus:border-cyan-500 text-sm cursor-pointer">
                    <option value="" disabled selected hidden>Please load a valid URL...</option>
                </select>
            </div>

            <button onclick="startStreamingNow()" class="w-full bg-gradient-to-r from-teal-500 to-cyan-600 hover:opacity-95 text-white font-bold py-4 rounded-xl shadow-lg active:scale-[0.99] transition-all text-sm uppercase tracking-wide">
                Start Instant Stream
            </button>
        </div>
    </div>

    <script>
    let currentHls = null;

    async function loadVideo() {
        let videoUrl = document.getElementById("url").value;
        if(!videoUrl) return alert("Please paste a URL first!");

        let loadBtn = document.getElementById("loadBtn");
        loadBtn.innerText = 'Analyzing...';
        loadBtn.disabled = true;

        let select = document.getElementById("qualities");
        select.innerHTML = "<option>Mapping dynamic stream urls...</option>";

        try {
            let res = await fetch(`/.netlify/functions/get-video?url=${encodeURIComponent(videoUrl)}`);
            if (!res.ok) throw new Error("Failed");
            let data = await res.json();
            
            select.innerHTML = "";
            let defaultOpt = document.createElement("option");
            defaultOpt.text = "Select Stream Quality...";
            defaultOpt.disabled = true;
            defaultOpt.selected = true;
            select.appendChild(defaultOpt);

            data.forEach(item => {
                if (item.format === "hls") {
                    let opt = document.createElement("option");
                    opt.value = item.videoUrl;
                    opt.text = `Live Stream: ${item.quality}p`;
                    select.appendChild(opt);
                }
            });
        } catch (error) {
            select.innerHTML = "<option>Failed to fetch streams.</option>";
        } finally {
            loadBtn.innerText = 'Load';
            loadBtn.disabled = false;
        }
    }

    function startStreamingNow() {
        let videoUrl = document.getElementById("qualities").value;
        if(!videoUrl || videoUrl.startsWith("Select")) return alert("Choose a quality stream first!");

        let video = document.getElementById("video");
        let container = document.getElementById("videoContainer");
        container.classList.remove("hidden");

        if (currentHls) currentHls.destroy();

        // تمرير الرابط النهائي المصلح عبر السيرفر الوسيط
        let finalProxyUrl = `/.netlify/functions/get-video?stream=true&url=${encodeURIComponent(videoUrl)}`;

        if (Hls.isSupported()) {
            currentHls = new Hls({
                maxBufferLength: 8,
                maxMaxBufferLength: 15,
                enableWorker: true,
                lowLatencyMode: true
            });
            currentHls.loadSource(finalProxyUrl);
            currentHls.attachMedia(video);
            currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = finalProxyUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    }
    </script>
</body>
</html>

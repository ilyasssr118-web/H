<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Extractor Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #131a26;
            --accent: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #ffffff;
            --text-muted: #707e94;
            --error: #ff4a5a;
            --success: #00e676;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* حاوية التصميم العصري */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: var(--accent-gradient);
            border-radius: 26px;
            z-index: -1;
            opacity: 0.15;
            transition: opacity 0.3s;
        }

        .card:hover::before { opacity: 0.3; }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .input-wrapper {
            text-align: right;
            margin-bottom: 24px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            direction: ltr;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            outline: none;
        }

        /* أزرار عصرية وتفاعلية */
        button {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            color: #000;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        button:active { transform: translateY(0); }
        button:disabled { background: #202b3c; color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }

        /* شريط التحميل المتطور (Progress Bar) */
        .progress-container {
            margin-top: 24px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-gradient);
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>مستخرج الصور الذكي Pro</h1>
        <p>قم بلصق الرابط المباشر للألبوم لاستخراج الصور المباشرة فقط، وتصفية الشعارات المزعجة وتحميل ملف ZIP بضغطة واحدة.</p>
        
        <div class="input-wrapper">
            <label for="urlInput">رابط الاستجابة المباشر (URL)</label>
            <input type="text" id="urlInput" placeholder="https://www.erome.com/a/..." autocomplete="off">
        </div>
        
        <button id="downloadBtn" onclick="initiateBtnClick()">ابدأ الاستخراج والضغط</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div id="statusText" class="status-text"></div>
    </div>

    <script src="download.js"></script>
    <script>
        const statusText = document.getElementById('statusText');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const downloadBtn = document.getElementById('downloadBtn');

        function updateStatus(message, type) {
            statusText.innerText = message;
            if (type === "error") statusText.style.color = "var(--error)";
            else if (type === "success") statusText.style.color = "var(--success)";
            else statusText.style.color = "var(--accent)";
        }

        function updateProgress(percent, label) {
            progressContainer.style.display = 'block';
            progressFill.style.width = percent + '%';
            statusText.innerText = `${label} (${percent}%)`;
        }

        async function initiateBtnClick() {
            const urlInput = document.getElementById('urlInput').value.trim();
            downloadBtn.disabled = true;
            progressFill.style.width = '0%';
            
            try {
                // استدعاء الـ API من ملف download.js
                await executeDownload(urlInput, updateStatus, updateProgress);
            } catch (error) {
                updateStatus(error.message, "error");
                progressContainer.style.display = 'none';
            } finally {
                downloadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StreamX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #080810;
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --glass-hover: rgba(255,255,255,0.1);
  --blur: blur(24px) saturate(180%);
  --red: #ff3b30;
  --red2: #ff6961;
  --blue: #0a84ff;
  --text: rgba(255,255,255,0.95);
  --text2: rgba(255,255,255,0.6);
  --text3: rgba(255,255,255,0.35);
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html { height:100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* AMBIENT BACKGROUND */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(255,59,48,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(10,132,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 60% 10%, rgba(255,105,97,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

.page-wrap { position: relative; z-index: 1; }

/* ── HEADER ── */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  background: rgba(8,8,16,0.7);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-border);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 1200px;
  margin: 0 auto;
}

.logo {
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 0%, var(--red2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}

.search-wrap {
  flex: 1;
  position: relative;
  max-width: 480px;
}

.search-wrap input {
  width: 100%;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  color: var(--text);
  padding: 9px 40px 9px 16px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  transition: border-color .2s, background .2s;
}

.search-wrap input::placeholder { color: var(--text3); }
.search-wrap input:focus {
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.09);
}

.search-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text2);
  cursor: pointer;
  padding: 0;
  font-size: 15px;
  display: flex;
  align-items: center;
}

/* ── CONTENT AREA ── */
.content {
  padding-top: calc(var(--safe-top) + 70px);
  padding-bottom: calc(var(--safe-bottom) + 20px);
  max-width: 1200px;
  margin: 0 auto;
  padding-left: 12px;
  padding-right: 12px;
}

/* ── PAGE TITLE ── */
.page-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin: 16px 4px 12px;
}

/* ── VIDEO GRID ── */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}

@media (min-width: 600px) {
  .video-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
}
@media (min-width: 1000px) {
  .video-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
}

.video-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.video-card:active {
  transform: scale(0.96);
}

@media (hover: hover) {
  .video-card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.15);
  }
}

.thumb-wrap {
  position: relative;
  aspect-ratio: 16/9;
  overflow: hidden;
  background: rgba(255,255,255,0.04);
}

.thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .4s ease;
}

@media (hover: hover) {
  .video-card:hover .thumb-wrap img { transform: scale(1.06); }
}

.dur-badge {
  position: absolute;
  bottom: 7px;
  right: 7px;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: rgba(255,255,255,0.9);
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}

.qual-badge {
  position: absolute;
  top: 7px;
  left: 7px;
  background: rgba(255,59,48,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #fff;
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 20px;
  letter-spacing: 0.3px;
}

.play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  background: rgba(0,0,0,0.25);
  transition: opacity .2s;
}

.play-overlay svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
}

@media (hover: hover) {
  .video-card:hover .play-overlay { opacity: 1; }
}

.card-info { padding: 9px 11px 10px; }

.card-title {
  font-size: 12px;
  font-weight: 500;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--text);
  margin-bottom: 5px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text3);
}

.card-dot { width: 3px; height: 3px; background: var(--text3); border-radius: 50%; }

/* ── SKELETON ── */
.skel-card { border-radius: var(--radius); overflow: hidden; }
.skel-thumb { aspect-ratio: 16/9; }
.skel-line { height: 11px; margin: 8px 11px 5px; border-radius: 6px; }
.skel-line.short { width: 55%; margin-bottom: 10px; }
.skel {
  background: linear-gradient(90deg,
    rgba(255,255,255,0.05) 25%,
    rgba(255,255,255,0.09) 50%,
    rgba(255,255,255,0.05) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.6s ease-in-out infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ── PAGINATION ── */
.pagination {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 22px 0 8px;
}

.page-btn {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--text);
  padding: 9px 20px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  transition: background .2s, transform .15s;
}

.page-btn:active { transform: scale(0.96); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

@media (hover: hover) {
  .page-btn:hover:not(:disabled) { background: var(--glass-hover); }
}

.page-info {
  font-size: 12px;
  color: var(--text3);
  min-width: 60px;
  text-align: center;
}

/* ── PLAYER PAGE ── */
#player-page { display: none; }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  margin-bottom: 14px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  transition: transform .15s;
}

.back-btn:active { transform: scale(0.95); }

.player-layout {
  display: grid;
  grid-template-columns: 1fr 290px;
  gap: 14px;
}

@media (max-width: 860px) {
  .player-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

.video-wrap {
  border-radius: var(--radius);
  overflow: hidden;
  aspect-ratio: 16/9;
  position: relative;
  background: #000;
  border: 1px solid var(--glass-border);
}

#main-video { width: 100%; height: 100%; display: block; background: #000; }

.load-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.spinner {
  width: 38px;
  height: 38px;
  border: 2.5px solid rgba(255,255,255,0.1);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.video-info {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-top: 12px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.video-title-big {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.45;
  margin-bottom: 8px;
}

.video-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text2);
  flex-wrap: wrap;
}

.v-pill {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  color: var(--text2);
}

.err-msg {
  background: rgba(255,59,48,0.1);
  border: 1px solid rgba(255,59,48,0.25);
  color: var(--red2);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  margin-top: 10px;
  display: none;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}

/* ── SIDEBAR ── */
.sidebar-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text3);
  margin-bottom: 10px;
}

.related-card {
  display: flex;
  gap: 9px;
  cursor: pointer;
  padding: 7px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  margin-bottom: 6px;
  background: transparent;
  transition: background .2s, border-color .2s;
}

.related-card:active { background: var(--glass); }

@media (hover: hover) {
  .related-card:hover {
    background: var(--glass);
    border-color: var(--glass-border);
  }
}

.related-thumb {
  width: 96px;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.05);
}

.related-info { flex: 1; min-width: 0; }
.related-title {
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 4px;
}
.related-meta { font-size: 10.5px; color: var(--text3); }

/* ── ERROR ── */
.fetch-error {
  grid-column: 1/-1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
}
.fetch-error h3 { font-size: 16px; color: var(--text2); margin: 10px 0 6px; }
</style>
</head>
<body>
<div class="page-wrap">

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo" onclick="goHome()">StreamX</div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search videos..."
        onkeypress="if(event.key==='Enter')doSearch()"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="search-btn" onclick="doSearch()" aria-label="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- MAIN CONTENT -->
<div class="content">

  <!-- HOME -->
  <div id="home-page">
    <div class="page-title" id="pageLabel">Trending</div>
    <div class="video-grid" id="videoGrid"></div>
    <div class="pagination" id="pagination">
      <button class="page-btn" id="prevBtn" onclick="changePage(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
        Prev
      </button>
      <span class="page-info" id="pageInfo">Page 1</span>
      <button class="page-btn" id="nextBtn" onclick="changePage(1)">
        Next
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <!-- PLAYER -->
  <div id="player-page">
    <button class="back-btn" onclick="goHome()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
      Back
    </button>
    <div class="player-layout">
      <div>
        <div class="video-wrap">
          <video id="main-video" controls playsinline autoplay></video>
          <div class="load-overlay" id="loadOverlay">
            <div class="spinner"></div>
            <div style="color:var(--text3);font-size:11px;font-weight:500">Loading stream…</div>
          </div>
        </div>
        <div class="err-msg" id="errMsg"></div>
        <div class="video-info">
          <div class="video-title-big" id="vTitle">Loading…</div>
          <div class="video-meta-row">
            <span class="v-pill" id="vDur">—</span>
            <span class="v-pill" id="vQual">HD</span>
            <span style="color:var(--text3);font-size:11px" id="vUploader"></span>
          </div>
        </div>
      </div>
      <div class="sidebar">
        <div class="sidebar-title">Up Next</div>
        <div id="relatedList"></div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════
const API = '/api/get-video';
const HOME_URL = 'https://www.xvideos.com/';

let currentHls = null;
let currentPageUrl = HOME_URL;
let currentPage = 0;
let currentLabel = 'Trending';
let cachedVideos = [];
let loadController = null;

// ══════════════════════════════════════
// FETCH WITH TIMEOUT + ABORT
// ══════════════════════════════════════
async function apiFetch(url, signal) {
  const resp = await fetch(url, { signal });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

// ══════════════════════════════════════
// LOAD PAGE
// ══════════════════════════════════════
async function loadUrl(url, page = 0, label = null) {
  if (loadController) loadController.abort();
  loadController = new AbortController();
  const signal = loadController.signal;

  currentPageUrl = url;
  currentPage = page;
  if (label) currentLabel = label;

  document.getElementById('home-page').style.display = 'block';
  document.getElementById('player-page').style.display = 'none';
  document.getElementById('pageLabel').textContent = currentLabel;
  document.getElementById('pagination').style.display = 'none';
  document.getElementById('searchInput').value = label && label.startsWith('🔍') ? label.slice(3).replace(/^"|"$/g,'') : '';

  showSkeletons();

  const pagedUrl = buildPagedUrl(url, page);

  try {
    const data = await apiFetch(
      `${API}?list=true&url=${encodeURIComponent(pagedUrl)}`,
      signal
    );

    if (!data.videos?.length) { showError('No videos found.'); return; }

    cachedVideos = data.videos;
    renderGrid(data.videos);

    document.getElementById('pagination').style.display = 'flex';
    document.getElementById('pageInfo').textContent = `Page ${page + 1}`;
    document.getElementById('prevBtn').disabled = page === 0;

  } catch (err) {
    if (err.name === 'AbortError') return;
    showError('Failed to load videos. Check your API.');
  }
}

function buildPagedUrl(base, page) {
  if (page === 0) return base;
  if (base.match(/\/new\/?$/) || base.match(/\/best\/?$/)) return base.replace(/\/?$/, '') + '/' + page;
  if (base.includes('?')) return base + '&p=' + page;
  return base + 'new/' + page;
}

// ══════════════════════════════════════
// SEARCH
// ══════════════════════════════════════
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { loadUrl(HOME_URL, 0, 'Trending'); return; }
  const url = `https://www.xvideos.com/?k=${encodeURIComponent(q)}`;
  loadUrl(url, 0, `🔍 "${q}"`);
}

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
function renderGrid(videos) {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = videos.map(v => {
    const vJson = escJson(v);
    return `
    <div class="video-card" onclick="playVideo(${vJson})">
      <div class="thumb-wrap">
        <img src="${v.thumb}" alt="" loading="lazy" decoding="async"
          onerror="this.style.opacity=0">
        <div class="qual-badge">${v.quality || 'HD'}</div>
        ${v.duration ? `<div class="dur-badge">${v.duration}</div>` : ''}
        <div class="play-overlay">
          <svg viewBox="0 0 60 60" fill="none">
            <circle cx="30" cy="30" r="30" fill="rgba(0,0,0,0.5)"/>
            <polygon points="24,18 44,30 24,42" fill="white"/>
          </svg>
        </div>
      </div>
      <div class="card-info">
        <div class="card-title">${v.title}</div>
        ${v.uploader ? `<div class="card-meta"><span>${v.uploader}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function escJson(obj) {
  return JSON.stringify(obj)
    .replace(/&/g,'\\u0026')
    .replace(/</g,'\\u003c')
    .replace(/>/g,'\\u003e')
    .replace(/'/g,'\\u0027')
    .replace(/"/g, '&quot;');
}

function showSkeletons() {
  document.getElementById('videoGrid').innerHTML = Array(16).fill(0).map(() => `
    <div class="skel-card">
      <div class="skel skel-thumb"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line short"></div>
    </div>`).join('');
}

function showError(msg) {
  document.getElementById('videoGrid').innerHTML =
    `<div class="fetch-error"><div style="font-size:40px">📡</div><h3>Oops</h3><p>${msg}</p></div>`;
}

// ══════════════════════════════════════
// PAGINATION
// ══════════════════════════════════════
function changePage(dir) {
  const next = currentPage + dir;
  if (next < 0) return;
  loadUrl(currentPageUrl, next, currentLabel);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════════════════════════════
// PLAY VIDEO
// ══════════════════════════════════════
async function playVideo(v) {
  if (loadController) loadController.abort();
  loadController = new AbortController();

  document.getElementById('home-page').style.display = 'none';
  document.getElementById('player-page').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'instant' });

  document.getElementById('vTitle').textContent = v.title;
  document.getElementById('vDur').textContent = v.duration || '—';
  document.getElementById('vQual').textContent = v.quality || 'HD';
  document.getElementById('vUploader').textContent = v.uploader || '';
  document.getElementById('loadOverlay').style.display = 'flex';
  document.getElementById('errMsg').style.display = 'none';

  // Related
  const related = cachedVideos.filter(x => x.eid !== v.eid).slice(0, 14);
  document.getElementById('relatedList').innerHTML = related.map(r => {
    const rj = escJson(r);
    return `
    <div class="related-card" onclick="playVideo(${rj})">
      <img class="related-thumb" src="${r.thumb}" alt="" loading="lazy" onerror="this.style.opacity=0">
      <div class="related-info">
        <div class="related-title">${r.title}</div>
        <div class="related-meta">${r.duration || ''} · ${r.uploader || ''}</div>
      </div>
    </div>`;
  }).join('');

  // Fetch stream
  try {
    const data = await apiFetch(
      `${API}?url=${encodeURIComponent(v.url)}`,
      loadController.signal
    );
    if (data.error) throw new Error(data.error);
    if (data.title) document.getElementById('vTitle').textContent = data.title;
    startStream(data.hls, data.mp4high, data.mp4low);
  } catch (err) {
    if (err.name === 'AbortError') return;
    document.getElementById('loadOverlay').style.display = 'none';
    const e = document.getElementById('errMsg');
    e.style.display = 'block';
    e.textContent = err.message;
  }
}

// ══════════════════════════════════════
// STREAM
// ══════════════════════════════════════
function startStream(hls, mp4high, mp4low) {
  const video = document.getElementById('main-video');
  const overlay = document.getElementById('loadOverlay');

  if (currentHls) { currentHls.destroy(); currentHls = null; }
  video.src = '';

  const hideOverlay = () => overlay.style.display = 'none';

  if (hls) {
    if (Hls.isSupported()) {
      currentHls = new Hls({
        maxBufferLength: 20,
        enableWorker: true,
        lowLatencyMode: false,
      });
      const proxyUrl = `${API}?stream=true&url=${encodeURIComponent(hls)}`;
      currentHls.loadSource(proxyUrl);
      currentHls.attachMedia(video);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => { hideOverlay(); video.play().catch(()=>{}); });
      currentHls.on(Hls.Events.ERROR, (e, d) => {
        if (d.fatal) { hideOverlay(); fallbackMp4(mp4high, mp4low); }
      });
      return;
    }
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = `${API}?stream=true&url=${encodeURIComponent(hls)}`;
      video.onloadedmetadata = () => { hideOverlay(); video.play(); };
      return;
    }
  }
  fallbackMp4(mp4high, mp4low);
}

function fallbackMp4(hi, lo) {
  const video = document.getElementById('main-video');
  const overlay = document.getElementById('loadOverlay');
  const src = hi || lo;
  if (!src) { overlay.style.display = 'none'; return; }
  video.src = src;
  video.onloadeddata = () => { overlay.style.display = 'none'; video.play().catch(()=>{}); };
  video.onerror = () => { overlay.style.display = 'none'; };
}

// ══════════════════════════════════════
// NAV
// ══════════════════════════════════════
function goHome() {
  if (currentHls) { currentHls.destroy(); currentHls = null; }
  document.getElementById('main-video').src = '';
  document.getElementById('player-page').style.display = 'none';
  document.getElementById('home-page').style.display = 'block';
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
loadUrl(HOME_URL, 0, 'Trending');
</script>

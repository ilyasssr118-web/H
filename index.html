<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستخرج ومحمل الصور الذكي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a2e; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #16213e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 100%; max-width: 600px; text-align: center; border: 1px solid #0f3460; }
        h1 { color: #e94560; font-size: 24px; margin-bottom: 10px; }
        p { color: #95a5a6; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #00fff5; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #0f3460; border-radius: 8px; background-color: #1a1a2e; color: #fff; font-size: 15px; transition: border-color 0.3s; text-align: left; direction: ltr; }
        input[type="text"]:focus { border-color: #e94560; outline: none; }
        button { background-color: #e94560; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.3s, transform 0.1s; }
        button:hover { background-color: #ff5e7e; }
        button:disabled { background-color: #536162; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 14px; font-weight: bold; color: #00fff5; min-height: 20px; }
        .footer { margin-top: 25px; font-size: 12px; color: #536162; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مستخرج ألبومات الصور الذكي 🚀</h1>
        <p>موقع HTML مستقل تماماً للتحميل المباشر لصور الألبوم داخل ملف ZIP مصفى ومحمي.</p>
        
        <div class="form-group">
            <label for="urlInput">رابط الألبوم (URL):</label>
            <input type="text" id="urlInput" placeholder="https://www.erome.com/a/..." autocomplete="off">
        </div>
        
        <button id="downloadBtn" onclick="startDownload()">استخراج وتحميل الألبوم (ZIP)</button>
        
        <div id="statusMessage" class="status"></div>
        
        <div class="footer">المعالجة تتم بالكامل محلياً داخل متصفحك وتستبعد الشعارات تلقائياً</div>
    </div>

    <script>
        async function startDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusMessage = document.getElementById('statusMessage');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!urlInput) {
                statusMessage.innerHTML = "<span style='color: #ff7597;'>يرجى إدخال الرابط أولاً!</span>";
                return;
            }

            // إعدادات تفعيل زر التحميل والتحكم في الواجهة
            downloadBtn.disabled = true;
            statusMessage.style.color = "#00fff5";
            statusMessage.innerText = "جاري جلب بيانات الألبوم وفك حظر الحماية...";

            try {
                // استخدام بروكسي مجاني لتخطي حظر الـ CORS لقراءة الـ Response الخاص بالرابط
                const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(urlInput);
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error("فشل الاتصال بالخادم الوسيط");
                
                const data = await response.json();
                const htmlContent = data.contents;

                // إنشاء عنصر وهمي لتحليل الـ HTML المسترجع
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                // تجميع كل العناصر الممكن احتواؤها على صور
                const elements = doc.querySelectorAll('img, div');
                const imageUrls = new Set();

                elements.forEach(el => {
                    ['src', 'data-src'].forEach(attr => {
                        let src = el.getAttribute(attr);
                        if (src) {
                            // تنظيف الرابط والتأكد من أنه امتداد صورة
                            if (/\.(jpeg|jpg|png|webp)/i.test(src)) {
                                // حل مشكلة الروابط النسبية وتحويلها لروابط كاملة
                                if (src.startsWith('//')) src = 'https:' + src;
                                else if (src.startsWith('/')) {
                                    const origin = new URL(urlInput).origin;
                                    src = origin + src;
                                }

                                // [تصفية الصور الخارجة عن النطاق المحدود للألبوم]
                                const filename = src.split('/').pop().toLowerCase();
                                const excluded = ['logo', 'bg.', 'icon', 'avatar', 'banner', 'button', 'loader', 'favicon'];
                                
                                const isExcluded = excluded.some(word => filename.includes(word));
                                if (!isExcluded) {
                                    imageUrls.add(src);
                                }
                            }
                        }
                    });
                });

                if (imageUrls.size === 0) {
                    throw new Error("لم يتم العثور على صور تطابق معايير الألبوم.");
                }

                statusMessage.innerText = `تم العثور على ${imageUrls.size} صورة. جاري التحميل والضغط الآن...`;

                // تحضير ملف الـ ZIP المشفر في المتصفح
                const zip = new JSZip();
                const urlsArray = Array.from(imageUrls);
                let loadedCount = 0;

                // تحميل الصور واحدة تلو الأخرى وإضافتها للـ ZIP
                for (let i = 0; i < urlsArray.length; i++) {
                    const imgUrl = urlsArray[i];
                    try {
                        // استخدام البروكسي أيضاً لتحميل الصور لتفادي مشاكل الحظر والأمان للمتصفح
                        const imgResp = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(imgUrl));
                        if (imgResp.ok) {
                            const blob = await imgResp.blob();
                            let cleanName = imgUrl.split('/').pop().split('?')[0];
                            if(!cleanName) cleanName = `image_${i+1}.jpg`;
                            
                            zip.file(cleanName, blob);
                            loadedCount++;
                            statusMessage.innerText = `جاري تجهيز الصور: (${loadedCount}/${imageUrls.size})`;
                        }
                    } catch (e) {
                        console.error("خطأ في تحميل صورة محددة:", e);
                    }
                }

                if (loadedCount === 0) throw new Error("فشل تحميل محتوى الصور المستخرجة.");

                statusMessage.innerText = "جاري إنشاء ملف الـ ZIP النهائي وتصديره...";
                
                // توليد ملف الـ ZIP وحفظه بجهاز المستخدم تلقائياً
                const content = await zip.generateAsync({ type: "blob" });
                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(content);
                
                // استخراج اسم الألبوم لوضعه كإسم للملف المضغوط
                const albumId = urlInput.replace(/\/$/, '').split('/').pop();
                downloadLink.download = `album_${albumId || 'gallery'}.zip`;
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                statusMessage.style.color = "#00ff66";
                statusMessage.innerText = "اكتمل التحميل بنجاح! 🎉";

            } catch (error) {
                statusMessage.style.color = "#ff7597";
                statusMessage.innerText = "حدث خطأ: " + error.message;
            } finally {
                downloadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>

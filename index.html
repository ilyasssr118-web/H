<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StreamX</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<div class="page-wrap">
  <header>
    <div class="header-inner">
      <button class="logo" id="homeLogo" type="button" aria-label="Go home">StreamX</button>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search videos..."
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="search-btn" id="searchBtn" type="button" aria-label="Search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
        <div class="suggestions" id="suggestions" aria-live="polite"></div>
      </div>
    </div>
  </header>

  <nav class="cat-nav" id="catNav">
    <div class="cat-inner" id="catInner">
      <button class="cat-chip active" data-url="https://www.xvideos.com/" data-label="Trending" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Trending
      </button>
      <button class="cat-chip" data-url="https://www.xvideos.com/new/" data-label="New" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        New
      </button>
      <button class="cat-chip" data-url="https://www.xvideos.com/best/" data-label="Best" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Best
      </button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/amateur" data-label="Amateur" type="button">Amateur</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/milf" data-label="MILF" type="button">MILF</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/teen" data-label="Teen" type="button">Teen</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/anal" data-label="Anal" type="button">Anal</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/lesbian" data-label="Lesbian" type="button">Lesbian</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/asian" data-label="Asian" type="button">Asian</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/big-tits" data-label="Big Tits" type="button">Big Tits</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/blonde" data-label="Blonde" type="button">Blonde</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/brunette" data-label="Brunette" type="button">Brunette</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/latina" data-label="Latina" type="button">Latina</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/threesome" data-label="Threesome" type="button">Threesome</button>
      <button class="cat-chip" data-url="https://www.xvideos.com/tags/pov" data-label="POV" type="button">POV</button>
    </div>
  </nav>

  <div class="content">
    <div id="home-page">
      <div class="page-title" id="pageLabel">Trending</div>
      <div class="video-grid" id="videoGrid"></div>
      <div class="pagination" id="pagination">
        <button class="page-btn" id="prevBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
          Prev
        </button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button class="page-btn" id="nextBtn" type="button">
          Next
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <div id="player-page">
      <button class="back-btn" id="backBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
        Back
      </button>
      <div class="player-layout">
        <div>
          <div class="player-container" id="playerContainer">
            <video id="main-video" playsinline preload="metadata"></video>

            <div class="load-overlay" id="loadOverlay">
              <div class="spinner"></div>
              <div style="color:var(--text3);font-size:11px;font-weight:500">Loading stream...</div>
            </div>

            <div class="quality-switch-overlay" id="qualitySwitchOverlay">
              <div class="spinner"></div>
              <div style="color:var(--text2);font-size:12px;font-weight:500">Switching quality...</div>
            </div>

            <div class="big-play" id="bigPlay" aria-hidden="true">
              <div class="big-play-circle">
                <svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>
              </div>
            </div>

            <div class="seek-indicator left" id="seekLeft" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11,19 2,12 11,5"/><polygon points="22,19 13,12 22,5"/></svg>
            </div>
            <div class="seek-indicator right" id="seekRight" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="13,19 22,12 13,5"/><polygon points="2,19 11,12 2,5"/></svg>
            </div>

            <div class="custom-controls" id="customControls">
              <div class="progress-wrap" id="progressWrap">
                <div class="progress-track" id="progressTrack">
                  <div class="progress-buffered" id="progressBuffered"></div>
                  <div class="progress-played" id="progressPlayed"></div>
                  <div class="progress-thumb" id="progressThumb"></div>
                </div>
                <div class="progress-tooltip" id="progressTooltip">0:00</div>
              </div>
              <div class="controls-row">
                <button class="ctrl-btn" id="playPauseBtn" type="button" aria-label="Play or pause">
                  <svg id="iconPlay" viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>
                  <svg id="iconPause" viewBox="0 0 24 24" fill="white" style="display:none"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>
                </button>
                <button class="ctrl-btn small" id="rewindBtn" type="button" title="Rewind 10s" aria-label="Rewind 10 seconds">
                  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><text x="12" y="16" fill="white" stroke="none" font-size="8" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">10</text></svg>
                </button>
                <button class="ctrl-btn small" id="forwardBtn" type="button" title="Forward 10s" aria-label="Forward 10 seconds">
                  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/><text x="12" y="16" fill="white" stroke="none" font-size="8" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">10</text></svg>
                </button>
                <div class="volume-wrap" id="volumeWrap">
                  <button class="ctrl-btn small" id="volumeBtn" type="button" aria-label="Toggle mute">
                    <svg id="iconVolOn" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="white"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    <svg id="iconVolOff" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" style="display:none"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="white"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                  </button>
                  <div class="volume-slider-wrap">
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                  </div>
                </div>
                <span class="ctrl-time" id="ctrlTime">0:00 / 0:00</span>
                <div class="ctrl-spacer"></div>
                <button class="ctrl-btn" id="qualityCtrlBtn" type="button" title="Quality" aria-label="Quality">
                  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <button class="ctrl-btn" id="fullscreenBtn" type="button" aria-label="Fullscreen">
                  <svg id="iconFsOn" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                  <svg id="iconFsOff" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg>
                </button>
              </div>
            </div>

            <div class="sheet-backdrop" id="qualityBackdrop"></div>
            <div class="bottom-sheet" id="qualitySheet" aria-label="Video quality chooser">
              <div class="sheet-handle"></div>
              <div class="sheet-header">
                <span>Video Quality</span>
                <button class="sheet-close" id="qualityCloseBtn" type="button" aria-label="Close quality menu">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
              </div>
              <div class="sheet-list" id="qualitySheetList"></div>
            </div>
          </div>

          <div class="err-msg" id="errMsg"></div>

          <div class="video-info">
            <div class="video-title-big" id="vTitle">Loading...</div>
            <div class="video-meta-row">
              <span class="v-pill" id="vDur">&mdash;</span>
              <span class="v-pill" id="vQual">HD</span>
              <span style="color:var(--text3);font-size:11px" id="vUploader"></span>
            </div>
          </div>

          <div class="player-actions">
            <button class="action-btn" id="downloadBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download
            </button>
            <button class="action-btn primary" id="quickDownloadBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              Quick Download
            </button>
          </div>
        </div>

        <div class="sidebar">
          <div class="sidebar-title">Up Next</div>
          <div id="relatedList"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer" id="siteFooter">
    <div class="footer-inner">
      <span class="footer-brand">StreamX</span>
      <div class="footer-links">
        <a href="#" data-nav="home">Home</a>
        <a href="#" data-nav="new">New Videos</a>
        <a href="#" data-nav="best">Top Rated</a>
      </div>
      <div class="footer-copy">StreamX &mdash; Premium streaming experience</div>
    </div>
  </footer>
</div>

<div class="sheet-backdrop" id="dlBackdrop"></div>
<div class="bottom-sheet" id="dlSheet" aria-label="Download chooser">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span>Download Video</span>
    <button class="sheet-close" id="dlCloseBtn" type="button" aria-label="Close download menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="sheet-list" id="dlSheetList"><div style="padding:12px 14px;font-size:13px;color:var(--text3)">Loading sources...</div></div>
</div>

<div class="dl-toast" id="dlToast" aria-live="polite">
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="dlToastMsg">Download started</span>
</div>

<script src="./js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Downloader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body {
  background: #0f172a;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 40px;
}
input {
  width: 300px;
  padding: 10px;
  border-radius: 10px;
  border: none;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<h2>🔥 Erome Downloader</h2>

<input id="url" placeholder="حط الرابط هنا">
<br><br>
<button onclick="start()">تحميل ZIP</button>

<p id="status"></p>

<script>
async function start() {
  const url = document.getElementById('url').value;
  const status = document.getElementById('status');

  status.innerText = "جاري جلب البيانات...";

  const res = await fetch('/api/download?url=' + encodeURIComponent(url));
  const data = await res.json();

  const zip = new JSZip();

  // تحميل الصور
  for (let i = 0; i < data.images.length; i++) {
    try {
      status.innerText = "تحميل صورة " + (i+1);

      const img = await fetch(data.images[i]);
      const blob = await img.blob();

      zip.file("image_" + i + ".jpg", blob);
    } catch (e) {
      console.log("فشل صورة", e);
    }
  }

  // الفيديوهات (محاولة تحميل)
  for (let i = 0; i < data.videos.length; i++) {
    try {
      status.innerText = "تحميل فيديو " + (i+1);

      const vid = await fetch(data.videos[i]);
      const blob = await vid.blob();

      zip.file("video_" + i + ".mp4", blob);
    } catch (e) {
      console.log("فشل فيديو، نحط رابطه فقط");

      zip.file("video_" + i + ".txt", data.videos[i]);
    }
  }

  status.innerText = "جاري إنشاء ZIP...";

  const content = await zip.generateAsync({ type: "blob" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(content);
  a.download = "files.zip";
  a.click();

  status.innerText = "تم التحميل ✅";
}
</script>

</body>
</html>

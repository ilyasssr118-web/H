<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StreamX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #06060e;
  --surface: rgba(255,255,255,0.04);
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.1);
  --glass-hover: rgba(255,255,255,0.12);
  --blur: blur(24px) saturate(180%);
  --red: #ff3b30;
  --red2: #ff6961;
  --red-glow: rgba(255,59,48,0.3);
  --blue: #0a84ff;
  --green: #30d158;
  --text: rgba(255,255,255,0.95);
  --text2: rgba(255,255,255,0.6);
  --text3: rgba(255,255,255,0.35);
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --transition: cubic-bezier(.34,1.56,.64,1);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { height:100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(255,59,48,0.1) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(10,132,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 60% 10%, rgba(255,105,97,0.04) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.3;
}
.page-wrap { position: relative; z-index: 1; }

/* ── HEADER ── */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  padding: calc(var(--safe-top) + 12px) 20px 12px;
  background: rgba(6,6,14,0.8);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-border);
}
.header-inner { display: flex; align-items: center; gap: 16px; max-width: 1400px; margin: 0 auto; }
.logo {
  font-weight: 800; font-size: 22px; letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 0%, var(--red) 50%, var(--red2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  cursor: pointer; white-space: nowrap; user-select: none; transition: opacity .2s;
}
.logo:hover { opacity: 0.85; }
.search-wrap { flex: 1; position: relative; max-width: 520px; }
.search-wrap input {
  width: 100%; background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 50px; color: var(--text); padding: 10px 44px 10px 18px;
  font-size: 14px; outline: none; font-family: inherit;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: border-color .25s, background .25s, box-shadow .25s;
}
.search-wrap input::placeholder { color: var(--text3); }
.search-wrap input:focus {
  border-color: rgba(255,59,48,0.4); background: rgba(255,255,255,0.09);
  box-shadow: 0 0 0 3px rgba(255,59,48,0.1);
}
.search-btn {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  background: var(--red); border: none; color: #fff; cursor: pointer;
  padding: 7px 12px; font-size: 15px; display: flex; align-items: center;
  border-radius: 50px; transition: background .2s, transform .15s;
}
.search-btn:hover { background: #e63529; }
.search-btn:active { transform: translateY(-50%) scale(0.92); }

/* ── SEARCH SUGGESTIONS ── */
.suggestions {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: rgba(18,18,28,0.98);
  backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
  border: 1px solid var(--glass-border); border-radius: 16px;
  max-height: 380px; overflow-y: auto; z-index: 300;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity .2s, transform .2s;
  -webkit-overflow-scrolling: touch;
}
.suggestions.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
.sug-header {
  padding: 10px 16px 6px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3);
  display: flex; align-items: center; gap: 6px;
}
.sug-header svg { width: 12px; height: 12px; color: var(--red); }
.sug-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; cursor: pointer; border: none; background: none;
  width: 100%; font-family: inherit; color: var(--text); text-align: left;
  transition: background .12s;
}
.sug-item:hover, .sug-item.focused { background: rgba(255,255,255,0.06); }
.sug-item:active { background: rgba(255,255,255,0.1); }
.sug-item-thumb {
  width: 64px; height: 36px; border-radius: 6px; object-fit: cover;
  background: rgba(255,255,255,0.04); flex-shrink: 0;
}
.sug-item-text { flex: 1; min-width: 0; }
.sug-item-title {
  font-size: 12.5px; font-weight: 500; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sug-item-meta { font-size: 10.5px; color: var(--text3); margin-top: 2px; }
.sug-item-icon { flex-shrink: 0; width: 16px; height: 16px; color: var(--text3); }
.sug-text-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; cursor: pointer; border: none; background: none;
  width: 100%; font-family: inherit; color: var(--text2); text-align: left;
  font-size: 13px; transition: background .12s;
}
.sug-text-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.sug-text-item svg { width: 14px; height: 14px; color: var(--text3); flex-shrink: 0; }
.sug-divider { height: 1px; background: var(--glass-border); margin: 4px 12px; }
.sug-clear {
  display: block; width: 100%; padding: 10px 16px; border: none;
  background: none; color: var(--red); font-size: 12px; font-weight: 600;
  text-align: center; cursor: pointer; font-family: inherit;
  transition: background .12s;
}
.sug-clear:hover { background: rgba(255,59,48,0.08); }

/* ── CATEGORY NAV ── */
.cat-nav {
  position: fixed; top: calc(var(--safe-top) + 56px); left: 0; right: 0; z-index: 190;
  background: rgba(6,6,14,0.75);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -ms-overflow-style: none;
}
.cat-nav::-webkit-scrollbar { display: none; }
.cat-inner {
  display: flex; gap: 4px; padding: 8px 20px;
  max-width: 1400px; margin: 0 auto; white-space: nowrap;
}
.cat-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: 50px;
  background: var(--glass); border: 1px solid var(--glass-border);
  color: var(--text2); font-size: 12.5px; font-weight: 500;
  cursor: pointer; font-family: inherit; white-space: nowrap;
  transition: background .2s, color .2s, border-color .2s, transform .15s;
  flex-shrink: 0;
}
.cat-chip:active { transform: scale(0.95); }
.cat-chip:hover { background: var(--glass-hover); color: var(--text); border-color: rgba(255,255,255,0.15); }
.cat-chip.active {
  background: var(--red); border-color: var(--red); color: #fff; font-weight: 600;
  box-shadow: 0 2px 12px var(--red-glow);
}
.cat-chip svg { width: 13px; height: 13px; }

/* ── FOOTER ── */
.site-footer {
  border-top: 1px solid var(--glass-border);
  padding: 40px 20px calc(var(--safe-bottom) + 24px);
  margin-top: 48px;
}
.footer-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px;
}
.footer-brand {
  font-weight: 800; font-size: 18px;
  background: linear-gradient(135deg, #fff 0%, var(--red) 50%, var(--red2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.footer-links { display: flex; gap: 20px; flex-wrap: wrap; }
.footer-links a {
  color: var(--text3); text-decoration: none; font-size: 12px; font-weight: 500;
  transition: color .2s;
}
.footer-links a:hover { color: var(--text); }
.footer-copy { color: var(--text3); font-size: 11px; width: 100%; text-align: center; margin-top: 12px; }
@media (max-width: 480px) {
  .footer-inner { justify-content: center; text-align: center; }
  .footer-links { justify-content: center; }
}

/* ── CONTENT ── */
.content {
  padding-top: calc(var(--safe-top) + 112px);
  padding-bottom: calc(var(--safe-bottom) + 30px);
  max-width: 1400px; margin: 0 auto; padding-left: 16px; padding-right: 16px;
}
.page-title {
  font-size: 13px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 1px; margin: 20px 4px 14px;
  display: flex; align-items: center; gap: 8px;
}
.page-title::before {
  content: ''; width: 3px; height: 14px; background: var(--red); border-radius: 2px;
}

/* ── VIDEO GRID ── */
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
@media (min-width: 600px) { .video-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; } }
@media (min-width: 1000px) { .video-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; } }

.video-card {
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: var(--radius); overflow: hidden; cursor: pointer;
  transition: transform .3s var(--transition), box-shadow .3s, border-color .3s;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: relative;
}
.video-card:active { transform: scale(0.97); }
@media (hover: hover) {
  .video-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.15);
    border-color: rgba(255,59,48,0.3);
  }
}
.thumb-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; background: rgba(255,255,255,0.03); }
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
@media (hover: hover) { .video-card:hover .thumb-wrap img { transform: scale(1.08); } }
.dur-badge {
  position: absolute; bottom: 8px; right: 8px;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: rgba(255,255,255,0.95); font-size: 10.5px; font-weight: 600;
  padding: 3px 8px; border-radius: 6px; letter-spacing: 0.3px;
}
.qual-badge {
  position: absolute; top: 8px; left: 8px;
  background: linear-gradient(135deg, var(--red), #ff6b6b);
  color: #fff; font-size: 9px; font-weight: 700; padding: 3px 7px;
  border-radius: 6px; letter-spacing: 0.5px; text-transform: uppercase;
}
.play-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  opacity: 0; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
  transition: opacity .25s;
}
.play-overlay svg { width: 48px; height: 48px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); transition: transform .2s; }
@media (hover: hover) {
  .video-card:hover .play-overlay { opacity: 1; }
  .video-card:hover .play-overlay svg { transform: scale(1.1); }
}
.card-info { padding: 10px 12px 12px; }
.card-title {
  font-size: 12.5px; font-weight: 500; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; color: var(--text); margin-bottom: 6px;
}
.card-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }

/* ── SKELETON ── */
.skel-card { border-radius: var(--radius); overflow: hidden; }
.skel-thumb { aspect-ratio: 16/9; }
.skel-line { height: 11px; margin: 8px 12px 5px; border-radius: 6px; }
.skel-line.short { width: 55%; margin-bottom: 12px; }
.skel {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%; animation: shimmer 1.6s ease-in-out infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ── PAGINATION ── */
.pagination { display: none; align-items: center; justify-content: center; gap: 12px; margin: 28px 0 12px; }
.page-btn {
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
  padding: 10px 24px; border-radius: 50px; cursor: pointer; font-size: 13px;
  font-weight: 500; font-family: inherit;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: background .2s, transform .15s, border-color .2s;
  display: flex; align-items: center; gap: 6px;
}
.page-btn:active { transform: scale(0.95); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
@media (hover: hover) { .page-btn:hover:not(:disabled) { background: var(--glass-hover); border-color: rgba(255,255,255,0.2); } }
.page-info { font-size: 12px; color: var(--text3); min-width: 70px; text-align: center; font-weight: 500; }

/* ── PLAYER PAGE ── */
#player-page { display: none; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
  padding: 9px 18px; border-radius: 50px; cursor: pointer; font-size: 13px;
  font-weight: 500; font-family: inherit; margin-bottom: 16px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: transform .15s, background .2s;
}
.back-btn:active { transform: scale(0.95); }
@media (hover: hover) { .back-btn:hover { background: var(--glass-hover); } }
.player-layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
@media (max-width: 900px) { .player-layout { grid-template-columns: 1fr; } .sidebar { display: none; } }

/* ── CUSTOM PLAYER ── */
.player-container {
  position: relative; border-radius: var(--radius); overflow: hidden;
  background: #000; border: 1px solid var(--glass-border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  aspect-ratio: 16/9;
  user-select: none; -webkit-user-select: none;
}
.player-container video {
  width: 100%; height: 100%; display: block; background: #000;
  object-fit: contain;
}
.player-container.fullscreen {
  position: fixed; inset: 0; z-index: 9999;
  border-radius: 0; border: none; aspect-ratio: unset;
}

/* Loading overlay */
.load-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  z-index: 10;
}
.spinner { width: 40px; height: 40px; border: 2.5px solid rgba(255,255,255,0.1); border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Quality switching overlay */
.quality-switch-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  z-index: 8; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.quality-switch-overlay.visible { opacity: 1; pointer-events: auto; }
.quality-switch-overlay .spinner { width: 28px; height: 28px; }

/* Big play button center */
.big-play {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 5; cursor: pointer; opacity: 0; transition: opacity .2s;
}
.big-play.visible { opacity: 1; }
.big-play-circle {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(255,59,48,0.9); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 24px rgba(255,59,48,0.4);
  transition: transform .2s, background .2s;
}
.big-play-circle:active { transform: scale(0.9); }
.big-play-circle svg { width: 28px; height: 28px; margin-left: 3px; }

/* Seek indicator */
.seek-indicator {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 50%; width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 6;
}
.seek-indicator.left { left: 15%; }
.seek-indicator.right { right: 15%; }
.seek-indicator.flash { opacity: 1; }
.seek-indicator svg { width: 24px; height: 24px; color: #fff; }

/* ── CUSTOM CONTROLS ── */
.custom-controls {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
  padding: 40px 14px 12px;
  opacity: 1; transition: opacity .3s;
  z-index: 7;
}
.player-container.controls-hidden .custom-controls { opacity: 0; pointer-events: none; }

/* Progress bar */
.progress-wrap {
  position: relative; width: 100%; height: 20px;
  display: flex; align-items: center; cursor: pointer;
  margin-bottom: 8px;
  -webkit-touch-callout: none;
}
.progress-track {
  width: 100%; height: 4px; background: rgba(255,255,255,0.15);
  border-radius: 2px; position: relative; overflow: visible;
  transition: height .15s;
}
.progress-wrap:hover .progress-track,
.progress-wrap.dragging .progress-track { height: 6px; }
.progress-buffered {
  position: absolute; top: 0; left: 0; height: 100%;
  background: rgba(255,255,255,0.2); border-radius: 2px;
}
.progress-played {
  position: absolute; top: 0; left: 0; height: 100%;
  background: var(--red); border-radius: 2px;
}
.progress-thumb {
  position: absolute; top: 50%; width: 14px; height: 14px;
  background: var(--red); border: 2px solid #fff; border-radius: 50%;
  transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  opacity: 0; transition: opacity .15s;
}
.progress-wrap:hover .progress-thumb,
.progress-wrap.dragging .progress-thumb { opacity: 1; }
.progress-tooltip {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: #fff; font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 6px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
.progress-wrap:hover .progress-tooltip { opacity: 1; }

/* Controls row */
.controls-row {
  display: flex; align-items: center; gap: 6px;
}
.ctrl-btn {
  background: none; border: none; color: #fff; cursor: pointer;
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: background .15s;
  flex-shrink: 0; padding: 0;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.1); }
.ctrl-btn:active { background: rgba(255,255,255,0.15); }
.ctrl-btn svg { width: 20px; height: 20px; }
.ctrl-btn.small svg { width: 16px; height: 16px; }

.ctrl-time {
  font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,0.8);
  white-space: nowrap; margin: 0 4px; letter-spacing: 0.3px;
  min-width: 80px;
}

.ctrl-spacer { flex: 1; }

/* Volume slider */
.volume-wrap {
  display: flex; align-items: center; gap: 2px; position: relative;
}
.volume-slider-wrap {
  width: 0; overflow: hidden; transition: width .2s;
}
.volume-wrap:hover .volume-slider-wrap,
.volume-wrap.active .volume-slider-wrap { width: 70px; }
.volume-slider {
  -webkit-appearance: none; appearance: none; width: 70px; height: 4px;
  background: rgba(255,255,255,0.2); border-radius: 2px; outline: none;
  cursor: pointer;
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  background: #fff; border-radius: 50%; cursor: pointer;
}

/* ── QUALITY BOTTOM SHEET (MOBILE) & DROPDOWN (DESKTOP) ── */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 10000; opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }

.bottom-sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(20,20,30,0.98);
  backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
  border-top: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px 20px 0 0;
  z-index: 10001;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.32,.72,.24,1);
  max-height: 70vh; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--safe-bottom) + 12px);
}
.sheet-backdrop.open + .bottom-sheet,
.bottom-sheet.open { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px; background: rgba(255,255,255,0.2);
  border-radius: 2px; margin: 10px auto 0;
}
.sheet-header {
  padding: 14px 20px 8px;
  font-size: 15px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; justify-content: space-between;
}
.sheet-close {
  background: rgba(255,255,255,0.1); border: none; color: var(--text2);
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.sheet-close:hover { background: rgba(255,255,255,0.15); }
.sheet-close svg { width: 16px; height: 16px; }

.sheet-list { padding: 4px 12px 12px; }
.sheet-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: 12px; cursor: pointer;
  transition: background .15s; border: none; background: none;
  width: 100%; font-family: inherit; text-align: left; color: var(--text);
}
.sheet-item:hover { background: rgba(255,255,255,0.06); }
.sheet-item:active { background: rgba(255,255,255,0.1); }
.sheet-item.active { background: rgba(255,59,48,0.12); }
.sheet-item-label { flex: 1; font-size: 14px; font-weight: 500; }
.sheet-item-sub { font-size: 12px; color: var(--text3); font-weight: 400; }
.sheet-item-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, background .15s;
}
.sheet-item.active .sheet-item-check {
  border-color: var(--red); background: var(--red);
}
.sheet-item-check svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
.sheet-item.active .sheet-item-check svg { opacity: 1; }
.sheet-divider { height: 1px; background: var(--glass-border); margin: 4px 14px; }

/* Desktop quality dropdown */
@media (min-width: 769px) {
  .sheet-backdrop { display: none !important; }
  .bottom-sheet {
    position: absolute; bottom: calc(100% + 8px); right: 8px;
    left: auto; top: auto;
    border-radius: 14px; border: 1px solid var(--glass-border);
    width: 240px; max-height: 360px;
    transform: scale(0.95) translateY(8px);
    opacity: 0; pointer-events: none;
    transition: transform .2s, opacity .2s;
    padding-bottom: 8px;
  }
  .bottom-sheet.open {
    transform: scale(1) translateY(0);
    opacity: 1; pointer-events: auto;
  }
  .sheet-handle { display: none; }
  .sheet-header { padding: 12px 16px 6px; font-size: 13px; }
  .sheet-list { padding: 2px 8px 4px; }
  .sheet-item { padding: 10px 12px; border-radius: 10px; }
  .sheet-item-label { font-size: 13px; }
  .sheet-item-sub { font-size: 11px; }
}

/* ── VIDEO INFO ── */
.video-info {
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: var(--radius); padding: 16px 18px; margin-top: 14px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.video-title-big { font-size: 16px; font-weight: 600; line-height: 1.45; margin-bottom: 12px; }
.video-meta-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--text2); flex-wrap: wrap;
}
.v-pill {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
  padding: 4px 12px; border-radius: 20px; font-size: 11px; color: var(--text2); font-weight: 500;
}

/* ── ACTION BAR ── */
.player-actions {
  display: flex; align-items: center; gap: 10px;
  margin-top: 14px; flex-wrap: wrap;
}
.action-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
  padding: 10px 18px; border-radius: 50px; cursor: pointer;
  font-size: 13px; font-weight: 500; font-family: inherit;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: background .2s, border-color .2s, transform .15s;
  white-space: nowrap; min-height: 42px;
}
.action-btn:active { transform: scale(0.95); }
@media (hover: hover) { .action-btn:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.2); } }
.action-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.action-btn.primary {
  background: linear-gradient(135deg, var(--red), #e63529);
  border-color: transparent; color: #fff;
  box-shadow: 0 4px 16px var(--red-glow);
}
.action-btn.primary:hover { background: linear-gradient(135deg, #e63529, #cc2d22); }

/* ── DOWNLOAD TOAST ── */
.dl-toast {
  position: fixed; bottom: calc(var(--safe-bottom) + 20px); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20,20,30,0.95);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border); border-radius: 14px;
  padding: 12px 20px; font-size: 13px; font-weight: 500; color: var(--text);
  opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  z-index: 20000; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.dl-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.dl-toast .toast-icon { width: 20px; height: 20px; color: var(--green); }

.err-msg {
  background: rgba(255,59,48,0.08); border: 1px solid rgba(255,59,48,0.2);
  color: var(--red2); padding: 12px 16px; border-radius: var(--radius-sm);
  font-size: 12.5px; margin-top: 12px; display: none;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}

/* ── SIDEBAR ── */
.sidebar-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text3); margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.sidebar-title::before { content: ''; width: 3px; height: 12px; background: var(--red); border-radius: 2px; }
.related-card {
  display: flex; gap: 10px; cursor: pointer; padding: 8px;
  border-radius: var(--radius-sm); border: 1px solid transparent;
  margin-bottom: 6px; background: transparent;
  transition: background .2s, border-color .2s, transform .15s;
}
.related-card:active { transform: scale(0.98); }
@media (hover: hover) { .related-card:hover { background: var(--glass); border-color: var(--glass-border); } }
.related-thumb { width: 100px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: rgba(255,255,255,0.04); }
.related-info { flex: 1; min-width: 0; }
.related-title { font-size: 11.5px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
.related-meta { font-size: 10.5px; color: var(--text3); }

/* ── ERROR ── */
.fetch-error { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--text3); }
.fetch-error h3 { font-size: 18px; color: var(--text2); margin: 12px 0 8px; font-weight: 600; }
.fetch-error p { font-size: 13px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

/* ── MOBILE ── */
@media (max-width: 480px) {
  .header-inner { gap: 10px; }
  .logo { font-size: 19px; }
  .search-wrap input { padding: 9px 40px 9px 14px; font-size: 13px; }
  .video-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .player-actions { gap: 8px; }
  .action-btn { padding: 9px 14px; font-size: 12px; }
  .ctrl-btn { width: 36px; height: 36px; }
  .ctrl-time { font-size: 10.5px; min-width: 70px; }
  .volume-wrap { display: none; }
  .cat-inner { padding: 6px 12px; gap: 6px; }
  .cat-chip { padding: 6px 12px; font-size: 11.5px; }
  .suggestions { border-radius: 12px; max-height: 320px; }
}

/* ── ANIMATIONS ── */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.video-card { animation: fadeInUp .4s ease backwards; }
.video-card:nth-child(1) { animation-delay: 0s; }
.video-card:nth-child(2) { animation-delay: .03s; }
.video-card:nth-child(3) { animation-delay: .06s; }
.video-card:nth-child(4) { animation-delay: .09s; }
.video-card:nth-child(5) { animation-delay: .12s; }
.video-card:nth-child(6) { animation-delay: .15s; }
.video-card:nth-child(7) { animation-delay: .18s; }
.video-card:nth-child(8) { animation-delay: .21s; }
</style>

          <!-- Download -->
          <button class="action-btn" id="downloadBtn" onclick="openDownloadSheet()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </button>
          <!-- Quick Download -->
          <button class="action-btn primary" id="quickDownloadBtn" onclick="quickDownload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            Quick Download
          </button>
        </div>
      </div>

      <div class="sidebar">
        <div class="sidebar-title">Up Next</div>
        <div id="relatedList"></div>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="site-footer" id="siteFooter">
  <div class="footer-inner">
    <span class="footer-brand">StreamX</span>
    <div class="footer-links">
      <a href="#" onclick="event.preventDefault();loadUrl(HOME_URL,0,'Trending');goHome()">Home</a>
      <a href="#" onclick="event.preventDefault();selectCategoryByLabel('New')">New Videos</a>
      <a href="#" onclick="event.preventDefault();selectCategoryByLabel('Best')">Top Rated</a>
    </div>
    <div class="footer-copy">StreamX &mdash; Premium streaming experience</div>
  </div>
</footer>
</div>

<!-- Download Sheet -->
<div class="sheet-backdrop" id="dlBackdrop" onclick="closeDownloadSheet()"></div>
<div class="bottom-sheet" id="dlSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span>Download Video</span>
    <button class="sheet-close" onclick="closeDownloadSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="sheet-list" id="dlSheetList">
    <div style="padding:12px 14px;font-size:13px;color:var(--text3)">Loading sources...</div>
  </div>
</div>

<!-- Toast -->
<div class="dl-toast" id="dlToast">
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="dlToastMsg">Download started</span>
</div>

<script>
const API = '/api/get-video';
const DL_API = '/api/download';
const HOME_URL = 'https://www.xvideos.com/';

let currentHls = null;
let currentPageUrl = HOME_URL;
let currentPage = 0;
let currentLabel = 'Trending';
let cachedVideos = [];
let loadController = null;

let hlsLevels = [];
let currentQualityIndex = -1;
let streamSources = { hls: null, mp4high: null, mp4low: null };
let controlsTimeout = null;
let isDragging = false;
let sugDebounce = null;
let searchHistory = JSON.parse(localStorage.getItem('sx_history') || '[]');
let sugFocusIdx = -1;

// ── FETCH ──
async function apiFetch(url, signal) {
  const resp = await fetch(url, { signal });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

// ── LOAD PAGE ──
async function loadUrl(url, page = 0, label = null) {
  if (loadController) loadController.abort();
  loadController = new AbortController();
  const signal = loadController.signal;
  currentPageUrl = url; currentPage = page;
  if (label) currentLabel = label;

  document.getElementById('home-page').style.display = 'block';
  document.getElementById('player-page').style.display = 'none';
  document.getElementById('catNav').style.display = '';
  document.getElementById('siteFooter').style.display = '';
  document.getElementById('pageLabel').textContent = currentLabel;
  document.getElementById('pagination').style.display = 'none';
  document.getElementById('searchInput').value = label && label.startsWith('\u{1F50D}') ? label.slice(3).replace(/^"|"$/g,'') : '';
  showSkeletons();

  const pagedUrl = buildPagedUrl(url, page);
  try {
    const data = await apiFetch(`${API}?list=true&url=${encodeURIComponent(pagedUrl)}`, signal);
    if (!data.videos?.length) { showError('No videos found.'); return; }
    cachedVideos = data.videos;
    renderGrid(data.videos);
    document.getElementById('pagination').style.display = 'flex';
    document.getElementById('pageInfo').textContent = `Page ${page + 1}`;
    document.getElementById('prevBtn').disabled = page === 0;
  } catch (err) {
    if (err.name === 'AbortError') return;
    showError('Failed to load videos. Check your API.');
  }
}

function buildPagedUrl(base, page) {
  if (page === 0) return base;
  if (base.match(/\/new\/?$/) || base.match(/\/best\/?$/)) return base.replace(/\/?$/, '') + '/' + page;
  if (base.includes('?')) return base + '&p=' + page;
  return base + 'new/' + page;
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  closeSuggestions();
  if (!q) { loadUrl(HOME_URL, 0, 'Trending'); return; }
  addToHistory(q);
  loadUrl(`https://www.xvideos.com/?k=${encodeURIComponent(q)}`, 0, `\u{1F50D} "${q}"`);
}

// ── SEARCH SUGGESTIONS ──
const searchInput = document.getElementById('searchInput');
const sugBox = document.getElementById('suggestions');

searchInput.addEventListener('input', () => {
  clearTimeout(sugDebounce);
  const q = searchInput.value.trim();
  if (!q) { showHistorySuggestions(); return; }
  sugDebounce = setTimeout(() => fetchSuggestions(q), 300);
});

searchInput.addEventListener('focus', () => {
  const q = searchInput.value.trim();
  if (!q) showHistorySuggestions();
  else fetchSuggestions(q);
});

searchInput.addEventListener('keydown', (e) => {
  const items = sugBox.querySelectorAll('.sug-item, .sug-text-item');
  if (!items.length || !sugBox.classList.contains('open')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); sugFocusIdx = Math.min(sugFocusIdx + 1, items.length - 1); updateSugFocus(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); sugFocusIdx = Math.max(sugFocusIdx - 1, -1); updateSugFocus(items); }
  else if (e.key === 'Enter' && sugFocusIdx >= 0) { e.preventDefault(); items[sugFocusIdx].click(); }
  else if (e.key === 'Escape') { closeSuggestions(); }
});

function updateSugFocus(items) {
  items.forEach((it, i) => it.classList.toggle('focused', i === sugFocusIdx));
  if (sugFocusIdx >= 0 && items[sugFocusIdx]) items[sugFocusIdx].scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) closeSuggestions();
});

function closeSuggestions() {
  sugBox.classList.remove('open');
  sugFocusIdx = -1;
}

async function fetchSuggestions(q) {
  try {
    const data = await apiFetch(`${API}?search=true&list=true&url=${encodeURIComponent('https://www.xvideos.com/?k=' + encodeURIComponent(q))}`);
    if (!data.videos?.length) { closeSuggestions(); return; }
    renderSuggestions(data.videos.slice(0, 8), q);
  } catch { closeSuggestions(); }
}

function renderSuggestions(videos, query) {
  sugFocusIdx = -1;
  let html = `<div class="sug-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Results for "${escHtml(query)}"</div>`;
  videos.forEach(v => {
    const vj = escJson(v);
    html += `<button class="sug-item" onclick="closeSuggestions();playVideo(${vj})">
      <img class="sug-item-thumb" src="${v.thumb}" alt="" loading="lazy" onerror="this.style.opacity=0">
      <div class="sug-item-text"><div class="sug-item-title">${escHtml(v.title)}</div>
      <div class="sug-item-meta">${v.duration||''} ${v.uploader ? '\u00b7 '+v.uploader : ''}</div></div>
      <svg class="sug-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>`;
  });
  sugBox.innerHTML = html;
  sugBox.classList.add('open');
}

function showHistorySuggestions() {
  if (!searchHistory.length) { closeSuggestions(); return; }
  sugFocusIdx = -1;
  let html = `<div class="sug-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Recent searches</div>`;
  searchHistory.slice(0, 6).forEach(q => {
    html += `<button class="sug-text-item" onclick="searchInput.value='${escHtml(q)}';doSearch()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ${escHtml(q)}</button>`;
  });
  html += `<div class="sug-divider"></div><button class="sug-clear" onclick="clearHistory()">Clear search history</button>`;
  sugBox.innerHTML = html;
  sugBox.classList.add('open');
}

function addToHistory(q) {
  searchHistory = searchHistory.filter(h => h.toLowerCase() !== q.toLowerCase());
  searchHistory.unshift(q);
  if (searchHistory.length > 10) searchHistory = searchHistory.slice(0, 10);
  localStorage.setItem('sx_history', JSON.stringify(searchHistory));
}

function clearHistory() {
  searchHistory = [];
  localStorage.removeItem('sx_history');
  closeSuggestions();
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── CATEGORIES ──
function selectCategory(el) {
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const url = el.dataset.url;
  const label = el.dataset.label;
  loadUrl(url, 0, label);
}

function selectCategoryByLabel(label) {
  const chip = document.querySelector(`.cat-chip[data-label="${label}"]`);
  if (chip) selectCategory(chip);
}

// ── RENDER ──
function renderGrid(videos) {
  document.getElementById('videoGrid').innerHTML = videos.map(v => {
    const vj = escJson(v);
    return `<div class="video-card" onclick="playVideo(${vj})">
      <div class="thumb-wrap">
        <img src="${v.thumb}" alt="" loading="lazy" decoding="async" onerror="this.style.opacity=0">
        <div class="qual-badge">${v.quality||'HD'}</div>
        ${v.duration?`<div class="dur-badge">${v.duration}</div>`:''}
        <div class="play-overlay"><svg viewBox="0 0 60 60" fill="none"><circle cx="30" cy="30" r="30" fill="rgba(0,0,0,0.5)"/><polygon points="24,18 44,30 24,42" fill="white"/></svg></div>
      </div>
      <div class="card-info">
        <div class="card-title">${v.title}</div>
        ${v.uploader?`<div class="card-meta"><span>${v.uploader}</span></div>`:''}
      </div></div>`;
  }).join('');
}

function escJson(obj) {
  return JSON.stringify(obj).replace(/&/g,'\\u0026').replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/'/g,'\\u0027').replace(/"/g,'&quot;');
}

function showSkeletons() {
  document.getElementById('videoGrid').innerHTML = Array(16).fill(0).map(() =>
    `<div class="skel-card"><div class="skel skel-thumb"></div><div class="skel skel-line"></div><div class="skel skel-line short"></div></div>`
  ).join('');
}

function showError(msg) {
  document.getElementById('videoGrid').innerHTML = `<div class="fetch-error"><div style="font-size:44px">&#128225;</div><h3>Oops</h3><p>${msg}</p></div>`;
}

function changePage(dir) {
  const next = currentPage + dir;
  if (next < 0) return;
  loadUrl(currentPageUrl, next, currentLabel);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── PLAY VIDEO ──
async function playVideo(v) {
  if (loadController) loadController.abort();
  loadController = new AbortController();

  document.getElementById('home-page').style.display = 'none';
  document.getElementById('player-page').style.display = 'block';
  document.getElementById('catNav').style.display = 'none';
  document.getElementById('siteFooter').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'instant' });

  document.getElementById('vTitle').textContent = v.title;
  document.getElementById('vDur').textContent = v.duration || '\u2014';
  document.getElementById('vQual').textContent = v.quality || 'HD';
  document.getElementById('vUploader').textContent = v.uploader || '';
  document.getElementById('loadOverlay').style.display = 'flex';
  document.getElementById('errMsg').style.display = 'none';
  document.getElementById('bigPlay').classList.remove('visible');

  hlsLevels = [];
  currentQualityIndex = -1;
  streamSources = { hls: null, mp4high: null, mp4low: null };
  resetQualitySheet();
  resetDownloadSheet();

  const related = cachedVideos.filter(x => x.eid !== v.eid).slice(0, 14);
  document.getElementById('relatedList').innerHTML = related.map(r => {
    const rj = escJson(r);
    return `<div class="related-card" onclick="playVideo(${rj})">
      <img class="related-thumb" src="${r.thumb}" alt="" loading="lazy" onerror="this.style.opacity=0">
      <div class="related-info"><div class="related-title">${r.title}</div>
      <div class="related-meta">${r.duration||''} &middot; ${r.uploader||''}</div></div></div>`;
  }).join('');

  try {
    const data = await apiFetch(`${API}?url=${encodeURIComponent(v.url)}`, loadController.signal);
    if (data.error) throw new Error(data.error);
    if (data.title) document.getElementById('vTitle').textContent = data.title;
    streamSources = { hls: data.hls, mp4high: data.mp4high, mp4low: data.mp4low };
    buildDownloadSheet();
    startStream(data.hls, data.mp4high, data.mp4low);
  } catch (err) {
    if (err.name === 'AbortError') return;
    document.getElementById('loadOverlay').style.display = 'none';
    const e = document.getElementById('errMsg');
    e.style.display = 'block'; e.textContent = err.message;
  }
}

// ── STREAM ──
function startStream(hls, mp4high, mp4low) {
  const video = document.getElementById('main-video');
  const overlay = document.getElementById('loadOverlay');
  if (currentHls) { currentHls.destroy(); currentHls = null; }
  video.src = '';
  const hideOverlay = () => { overlay.style.display = 'none'; };

  if (hls) {
    if (Hls.isSupported()) {
      currentHls = new Hls({ maxBufferLength: 20, enableWorker: true, lowLatencyMode: false });
      const proxyUrl = `${API}?stream=true&url=${encodeURIComponent(hls)}`;
      currentHls.loadSource(proxyUrl);
      currentHls.attachMedia(video);
      currentHls.on(Hls.Events.MANIFEST_PARSED, (ev, data) => {
        hideOverlay();
        video.play().catch(() => { document.getElementById('bigPlay').classList.add('visible'); });
        buildHlsQualitySheet(data.levels);
      });
      currentHls.on(Hls.Events.LEVEL_SWITCHED, (ev, data) => { updateActiveQuality(data.level); });
      currentHls.on(Hls.Events.ERROR, (ev, d) => { if (d.fatal) { hideOverlay(); fallbackMp4(mp4high, mp4low); } });
      return;
    }
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = `${API}?stream=true&url=${encodeURIComponent(hls)}`;
      video.onloadedmetadata = () => { hideOverlay(); video.play().catch(() => { document.getElementById('bigPlay').classList.add('visible'); }); };
      buildFallbackQualitySheet();
      return;
    }
  }
  fallbackMp4(mp4high, mp4low);
}

function fallbackMp4(hi, lo) {
  const video = document.getElementById('main-video');
  const overlay = document.getElementById('loadOverlay');
  const src = hi || lo;
  if (!src) { overlay.style.display = 'none'; return; }
  video.src = src;
  video.onloadeddata = () => {
    overlay.style.display = 'none';
    video.play().catch(() => { document.getElementById('bigPlay').classList.add('visible'); });
  };
  video.onerror = () => { overlay.style.display = 'none'; };
  buildFallbackQualitySheet();
}

// ── CUSTOM PLAYER CONTROLS ──
const video = document.getElementById('main-video');
const playerContainer = document.getElementById('playerContainer');

function togglePlay() {
  if (video.paused || video.ended) {
    video.play().catch(() => {});
  } else {
    video.pause();
  }
}

function updatePlayPauseIcon() {
  const playing = !video.paused && !video.ended;
  document.getElementById('iconPlay').style.display = playing ? 'none' : 'block';
  document.getElementById('iconPause').style.display = playing ? 'block' : 'none';
  document.getElementById('bigPlay').classList.toggle('visible', video.paused && !video.ended && video.readyState > 0);
}

video.addEventListener('play', updatePlayPauseIcon);
video.addEventListener('pause', updatePlayPauseIcon);
video.addEventListener('ended', () => {
  updatePlayPauseIcon();
  document.getElementById('bigPlay').classList.add('visible');
});

function seekRelative(secs) {
  if (!video.duration) return;
  video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + secs));
  const id = secs < 0 ? 'seekLeft' : 'seekRight';
  const el = document.getElementById(id);
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 300);
}

// Volume
const volumeSlider = document.getElementById('volumeSlider');
volumeSlider.addEventListener('input', () => {
  video.volume = parseFloat(volumeSlider.value);
  video.muted = false;
  updateVolumeIcon();
});

function toggleMute() {
  video.muted = !video.muted;
  if (!video.muted && video.volume === 0) { video.volume = 0.5; volumeSlider.value = 0.5; }
  updateVolumeIcon();
}

function updateVolumeIcon() {
  const off = video.muted || video.volume === 0;
  document.getElementById('iconVolOn').style.display = off ? 'none' : 'block';
  document.getElementById('iconVolOff').style.display = off ? 'block' : 'none';
  if (!video.muted) volumeSlider.value = video.volume;
}

// Time display
function formatTime(s) {
  if (!s || !isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

video.addEventListener('timeupdate', () => {
  if (isDragging) return;
  const pct = video.duration ? (video.currentTime / video.duration) * 100 : 0;
  document.getElementById('progressPlayed').style.width = pct + '%';
  document.getElementById('progressThumb').style.left = pct + '%';
  document.getElementById('ctrlTime').textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
});

video.addEventListener('progress', () => {
  if (video.buffered.length > 0) {
    const end = video.buffered.end(video.buffered.length - 1);
    const pct = video.duration ? (end / video.duration) * 100 : 0;
    document.getElementById('progressBuffered').style.width = pct + '%';
  }
});

// Progress bar interaction
const progressWrap = document.getElementById('progressWrap');
const progressTooltip = document.getElementById('progressTooltip');

function getProgressPct(e) {
  const rect = progressWrap.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
}

function onProgressDown(e) {
  isDragging = true;
  progressWrap.classList.add('dragging');
  seekToProgress(e);
  document.addEventListener('mousemove', onProgressMove);
  document.addEventListener('mouseup', onProgressUp);
  document.addEventListener('touchmove', onProgressMove, { passive: false });
  document.addEventListener('touchend', onProgressUp);
}

function onProgressMove(e) {
  if (!isDragging) return;
  if (e.cancelable) e.preventDefault();
  const pct = getProgressPct(e);
  document.getElementById('progressPlayed').style.width = (pct * 100) + '%';
  document.getElementById('progressThumb').style.left = (pct * 100) + '%';
  if (video.duration) {
    progressTooltip.textContent = formatTime(pct * video.duration);
    const rect = progressWrap.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    progressTooltip.style.left = (clientX - rect.left) + 'px';
  }
}

function onProgressUp(e) {
  if (isDragging) seekToProgress(e);
  isDragging = false;
  progressWrap.classList.remove('dragging');
  document.removeEventListener('mousemove', onProgressMove);
  document.removeEventListener('mouseup', onProgressUp);
  document.removeEventListener('touchmove', onProgressMove);
  document.removeEventListener('touchend', onProgressUp);
}

function seekToProgress(e) {
  if (!video.duration) return;
  const pct = getProgressPct(e);
  video.currentTime = pct * video.duration;
}

progressWrap.addEventListener('mousedown', onProgressDown);
progressWrap.addEventListener('touchstart', onProgressDown, { passive: true });

progressWrap.addEventListener('mousemove', (e) => {
  if (isDragging) return;
  const pct = getProgressPct(e);
  if (video.duration) {
    progressTooltip.textContent = formatTime(pct * video.duration);
    const rect = progressWrap.getBoundingClientRect();
    progressTooltip.style.left = (e.clientX - rect.left) + 'px';
  }
});

// Controls auto-hide
function showControls() {
  playerContainer.classList.remove('controls-hidden');
  resetControlsTimeout();
}

function resetControlsTimeout() {
  clearTimeout(controlsTimeout);
  controlsTimeout = setTimeout(() => {
    if (!video.paused && !isDragging) {
      playerContainer.classList.add('controls-hidden');
    }
  }, 3000);
}

playerContainer.addEventListener('mousemove', showControls);
playerContainer.addEventListener('touchstart', () => {
  if (playerContainer.classList.contains('controls-hidden')) {
    showControls();
  } else if (!video.paused) {
    playerContainer.classList.add('controls-hidden');
  }
}, { passive: true });

video.addEventListener('play', resetControlsTimeout);
video.addEventListener('pause', () => {
  clearTimeout(controlsTimeout);
  playerContainer.classList.remove('controls-hidden');
});

// Fullscreen
function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const el = playerContainer;
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
}

function onFsChange() {
  const fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  playerContainer.classList.toggle('fullscreen', fs);
  document.getElementById('iconFsOn').style.display = fs ? 'none' : 'block';
  document.getElementById('iconFsOff').style.display = fs ? 'block' : 'none';
}
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (document.getElementById('player-page').style.display !== 'block') return;
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ': case 'k': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); seekRelative(-10); break;
    case 'ArrowRight': e.preventDefault(); seekRelative(10); break;
    case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); updateVolumeIcon(); break;
    case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); updateVolumeIcon(); break;
    case 'f': e.preventDefault(); toggleFullscreen(); break;
    case 'm': e.preventDefault(); toggleMute(); break;
  }
});

// ── QUALITY SHEET ──
function openQualitySheet() {
  document.getElementById('qualityBackdrop').classList.add('open');
  document.getElementById('qualitySheet').classList.add('open');
}
function closeQualitySheet() {
  document.getElementById('qualityBackdrop').classList.remove('open');
  document.getElementById('qualitySheet').classList.remove('open');
}

function getQualityLabel(h) {
  if (h >= 1080) return '1080p';
  if (h >= 720) return '720p';
  if (h >= 480) return '480p';
  if (h >= 360) return '360p';
  if (h >= 240) return '240p';
  return h + 'p';
}

function buildHlsQualitySheet(levels) {
  hlsLevels = levels || [];
  const list = document.getElementById('qualitySheetList');
  const sorted = levels.map((l,i) => ({ index: i, height: l.height, width: l.width, bitrate: l.bitrate }))
    .sort((a,b) => b.height - a.height);

  let html = `<button class="sheet-item ${currentQualityIndex===-1?'active':''}" onclick="setQuality(-1,this)">
    <div class="sheet-item-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <span class="sheet-item-label">Auto</span><span class="sheet-item-sub">Adaptive</span>
  </button><div class="sheet-divider"></div>`;

  sorted.forEach(l => {
    const label = getQualityLabel(l.height);
    const res = `${l.width}\u00d7${l.height}`;
    html += `<button class="sheet-item ${currentQualityIndex===l.index?'active':''}" data-level="${l.index}" onclick="setQuality(${l.index},this)">
      <div class="sheet-item-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <span class="sheet-item-label">${label}</span><span class="sheet-item-sub">${res}</span>
    </button>`;
  });
  list.innerHTML = html;
}

function buildFallbackQualitySheet() {
  const list = document.getElementById('qualitySheetList');
  let html = '';
  if (streamSources.mp4high) html += `<button class="sheet-item active" data-source="mp4high" onclick="setMp4Quality('mp4high',this)">
    <div class="sheet-item-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <span class="sheet-item-label">High</span><span class="sheet-item-sub">720p</span></button>`;
  if (streamSources.mp4low) html += `<button class="sheet-item ${!streamSources.mp4high?'active':''}" data-source="mp4low" onclick="setMp4Quality('mp4low',this)">
    <div class="sheet-item-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <span class="sheet-item-label">Standard</span><span class="sheet-item-sub">480p</span></button>`;
  if (!html) html = '<div style="padding:14px;font-size:13px;color:var(--text3)">No quality options</div>';
  list.innerHTML = html;
}

function resetQualitySheet() {
  document.getElementById('qualitySheetList').innerHTML = `<button class="sheet-item active" onclick="setQuality(-1,this)">
    <div class="sheet-item-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <span class="sheet-item-label">Auto</span><span class="sheet-item-sub">Adaptive</span></button>`;
}

function setQuality(levelIndex, el) {
  if (!currentHls) return;
  const overlay = document.getElementById('qualitySwitchOverlay');
  overlay.classList.add('visible');

  currentQualityIndex = levelIndex;
  currentHls.currentLevel = levelIndex;

  document.querySelectorAll('#qualitySheetList .sheet-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');

  currentHls.once(Hls.Events.FRAG_LOADED, () => { overlay.classList.remove('visible'); });
  setTimeout(() => overlay.classList.remove('visible'), 3000);

  closeQualitySheet();
}

function setMp4Quality(sourceKey, el) {
  const currentTime = video.currentTime;
  const wasPlaying = !video.paused;
  const overlay = document.getElementById('qualitySwitchOverlay');
  overlay.classList.add('visible');

  video.src = streamSources[sourceKey];
  video.addEventListener('loadeddata', function handler() {
    video.currentTime = currentTime;
    overlay.classList.remove('visible');
    if (wasPlaying) video.play().catch(() => {});
    video.removeEventListener('loadeddata', handler);
  });

  document.querySelectorAll('#qualitySheetList .sheet-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  closeQualitySheet();
}

function updateActiveQuality(levelIndex) {
  if (currentQualityIndex !== -1) return;
  document.getElementById('qualitySwitchOverlay').classList.remove('visible');
}

// ── DOWNLOAD SHEET ──
function openDownloadSheet() {
  document.getElementById('dlBackdrop').classList.add('open');
  document.getElementById('dlSheet').classList.add('open');
}
function closeDownloadSheet() {
  document.getElementById('dlBackdrop').classList.remove('open');
  document.getElementById('dlSheet').classList.remove('open');
}

function buildDownloadSheet() {
  const list = document.getElementById('dlSheetList');
  let html = '';
  const title = document.getElementById('vTitle').textContent || 'video';
  const safeName = encodeURIComponent(title.replace(/[^a-zA-Z0-9 ]/g, '').trim().substring(0, 60));

  if (streamSources.mp4high) {
    const dlUrl = `${DL_API}?url=${encodeURIComponent(streamSources.mp4high)}&name=${safeName}`;
    html += `<a class="sheet-item" href="${dlUrl}" style="text-decoration:none;color:inherit" onclick="onDownloadClick(event,'High Quality')">
      <div class="sheet-item-check" style="border-color:var(--red);background:var(--red)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="opacity:1"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <span class="sheet-item-label">High Quality</span><span class="sheet-item-sub">720p MP4</span></a>`;
  }

  if (streamSources.mp4low) {
    const dlUrl = `${DL_API}?url=${encodeURIComponent(streamSources.mp4low)}&name=${safeName}`;
    html += `<a class="sheet-item" href="${dlUrl}" style="text-decoration:none;color:inherit" onclick="onDownloadClick(event,'Standard Quality')">
      <div class="sheet-item-check" style="border-color:var(--text3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="opacity:1"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <span class="sheet-item-label">Standard Quality</span><span class="sheet-item-sub">480p MP4</span></a>`;
  }

  if (!html) html = '<div style="padding:14px;font-size:13px;color:var(--text3)">No downloads available</div>';
  list.innerHTML = html;
}

function resetDownloadSheet() {
  document.getElementById('dlSheetList').innerHTML = '<div style="padding:14px;font-size:13px;color:var(--text3)">Loading sources...</div>';
}

function onDownloadClick(e, label) {
  closeDownloadSheet();
  showToast(`Downloading ${label}...`);
}

function quickDownload() {
  const url = streamSources.mp4high || streamSources.mp4low;
  if (!url) { showToast('No download source available'); return; }

  const title = document.getElementById('vTitle').textContent || 'video';
  const safeName = encodeURIComponent(title.replace(/[^a-zA-Z0-9 ]/g, '').trim().substring(0, 60));
  const label = streamSources.mp4high ? 'High Quality' : 'Standard Quality';
  const dlUrl = `${DL_API}?url=${encodeURIComponent(url)}&name=${safeName}`;

  showToast(`Downloading ${label}...`);

  const a = document.createElement('a');
  a.href = dlUrl;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ── TOAST ──
let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('dlToast');
  document.getElementById('dlToastMsg').textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ── NAV ──
function goHome() {
  if (currentHls) { currentHls.destroy(); currentHls = null; }
  video.src = '';
  document.getElementById('player-page').style.display = 'none';
  document.getElementById('home-page').style.display = 'block';
  document.getElementById('catNav').style.display = '';
  document.getElementById('siteFooter').style.display = '';
  closeQualitySheet();
  closeDownloadSheet();
}

// ── INIT ──
loadUrl(HOME_URL, 0, 'Trending');
</script>

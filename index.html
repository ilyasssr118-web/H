<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Extractor Ultra Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-dark: #080c14;
            --card-bg: #0f1626;
            --accent: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #ffffff;
            --text-muted: #64748b;
            --error: #ff4a5a;
            --success: #00e676;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); font-size: 13.5px; margin-bottom: 25px; line-height: 1.5; }
        
        .input-wrapper { text-align: right; margin-bottom: 18px; }
        label { font-size: 12px; font-weight: 700; color: var(--accent); display: block; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        input[type="text"], textarea {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; color: #fff; font-size: 14px; transition: all 0.25s ease;
        }
        input[type="text"]:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 12px rgba(0, 242, 254, 0.15); }
        
        textarea { height: 100px; resize: none; font-family: monospace; font-size: 11px; direction: ltr; text-align: left; }
        
        .divider { margin: 20px 0; display: flex; align-items: center; color: var(--text-muted); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.08); margin: 0 10px; }

        button {
            width: 100%; padding: 15px; background: var(--accent-gradient); color: #000; font-weight: 700; font-size: 15px; border: none; border-radius: 12px; cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2);
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 242, 254, 0.4); }
        button:disabled { background: #1e293b; color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }

        .progress-container { margin-top: 20px; display: none; }
        .progress-bar { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent-gradient); transition: width 0.2s ease; }
        
        .status-text { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>مستخرج الصور التلقائي ⚡</h1>
        <p>تحميل فوري ومصفى لـ 42 صورة للألبوم الفعلي دون لوجوهات أو بطء خوادم الـ Proxy.</p>
        
        <div class="input-wrapper">
            <label>1. رابط الألبوم الأساسي (لتسمية الملف)</label>
            <input type="text" id="urlInput" placeholder="https://www.erome.com/a/..." direction="ltr">
        </div>

        <div class="input-wrapper">
            <label>2. كود الـ Response أو الـ HTML (اختياري - للسرعة الفائقة 🚀)</label>
            <textarea id="htmlInput" placeholder="انسخ الـ Body أو الـ Response بالكامل من تطبيق الفحص والصقه هنا لتخطي بطء البروكسي..."></textarea>
        </div>
        
        <button id="downloadBtn" onclick="startProcessing()">ابدأ التحميل الصاروخي المصفى</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        
        <div id="statusText" class="status-text">جاهز لبدء العملية...</div>
    </div>

    <script src="download.js"></script>
    <script>
        const statusText = document.getElementById('statusText');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const downloadBtn = document.getElementById('downloadBtn');

        function updateStatus(message, type) {
            statusText.innerText = message;
            if (type === "error") statusText.style.color = "var(--error)";
            else if (type === "success") statusText.style.color = "var(--success)";
            else statusText.style.color = "var(--accent)";
        }

        function updateProgress(percent, label) {
            progressContainer.style.display = 'block';
            progressFill.style.width = percent + '%';
            statusText.innerText = `${label} (${percent}%)`;
        }

        async function startProcessing() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const htmlInput = document.getElementById('htmlInput').value.trim();
            
            if(!urlInput) {
                updateStatus("يرجى وضع الرابط الأساسي أولاً لتحديد هوية ومسار الصور.", "error");
                return;
            }

            downloadBtn.disabled = true;
            progressFill.style.width = '0%';
            
            try {
                let finalHtml = htmlInput;
                
                // إذا لم يقم المستخدم بلصق الـ HTML، نقوم بجلبه عبر البروكسي كخيار بديل
                if (!finalHtml) {
                    updateStatus("جاري جلب الـ Response عبر خادم وسيط (قد يستغرق وقتاً)...", "info");
                    const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(urlInput);
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("فشل البروكسي في جلب البيانات.");
                    const data = await response.json();
                    finalHtml = data.contents;
                }

                // تشغيل المعالجة والتحميل بالتوازي لسرعة خارقة وتصفية الأيقونات
                await executeDownload(finalHtml, urlInput, updateStatus, updateProgress);
                
            } catch (error) {
                updateStatus(error.message, "error");
                progressContainer.style.display = 'none';
            } finally {
                downloadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>

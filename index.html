<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top right, #091322, #030611, #000000); }
        .glass-card { background: rgba(11, 19, 36, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 antialiased">

    <div class="glass-card w-full max-w-2xl rounded-3xl p-8 shadow-2xl relative z-10 border border-slate-800">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">Bypass Engine Stable</h1>
            <p class="text-xs text-slate-400 mt-1">نسخة الإصلاح المستقرة - تشغيل فوري ومباشر</p>
        </div>

        <div id="videoContainer" class="hidden mb-6 overflow-hidden rounded-2xl border border-cyan-500/30 bg-black shadow-2xl">
            <video id="video" controls class="w-full aspect-video" autoplay playsinline></video>
        </div>

        <div class="space-y-4" dir="ltr">
            <div>
                <label class="block text-xs font-semibold text-cyan-400 mb-1 text-left">Target Video URL</label>
                <div class="relative">
                    <input type="text" id="url" placeholder="Paste link here..." 
                           class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-cyan-500 text-sm pr-24">
                    <button id="loadBtn" onclick="loadVideo()" 
                            class="absolute right-2 top-2 bottom-2 bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-xs px-5 rounded-lg transition-all">
                        Load
                    </button>
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-xs font-semibold text-blue-400 text-left">Stream Channels</label>
                <select id="qualities" 
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3.5 text-white appearance-none focus:outline-none focus:border-cyan-500 text-sm cursor-pointer">
                    <option value="" disabled selected>Waiting for link...</option>
                </select>
            </div>

            <button onclick="startStreamingNow()" 
                    class="w-full bg-gradient-to-r from-teal-500 to-cyan-600 text-white font-bold py-4 rounded-xl shadow-lg text-sm uppercase tracking-wider">
                ▶ Start Instant Stream
            </button>
            
            <div id="errorLog" class="hidden p-3 bg-red-950/40 border border-red-500/30 rounded-xl text-xs text-red-400 font-mono text-left whitespace-pre-wrap"></div>
            <div id="successLog" class="hidden p-3 bg-green-950/40 border border-green-500/30 rounded-xl text-xs text-green-400 font-mono text-left"></div>
        </div>
    </div>

    <script>
    let currentHls = null;

    function showError(msg) {
        const el = document.getElementById("errorLog");
        el.classList.remove("hidden");
        el.innerText = "[Error]: " + msg;
    }

    function showSuccess(msg) {
        const el = document.getElementById("successLog");
        el.classList.remove("hidden");
        el.innerText = "[OK]: " + msg;
    }

    function hideMessages() {
        document.getElementById("errorLog").classList.add("hidden");
        document.getElementById("successLog").classList.add("hidden");
    }

    async function loadVideo() {
        const videoUrl = document.getElementById("url").value.trim();
        if (!videoUrl) return alert("Please paste a URL first!");

        hideMessages();

        const loadBtn = document.getElementById("loadBtn");
        const select = document.getElementById("qualities");

        loadBtn.innerText = 'Loading...';
        loadBtn.disabled = true;
        select.innerHTML = "<option>Fetching streams...</option>";

        try {
            // ✅ مسار Vercel الصح
            const apiUrl = "/api/get-video?url=" + encodeURIComponent(videoUrl);
            const res = await fetch(apiUrl);
            const data = await res.json();

            if (!res.ok || data.error) {
                throw new Error(data.error || "Server error: " + res.status);
            }

            if (!Array.isArray(data) || data.length === 0) {
                throw new Error("No streams found for this URL.");
            }

            select.innerHTML = "";

            const defaultOpt = document.createElement("option");
            defaultOpt.text = "-- Select Quality --";
            defaultOpt.disabled = true;
            defaultOpt.selected = true;
            select.appendChild(defaultOpt);

            data.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.videoUrl;
                opt.text = "🎬 " + item.quality + "p";
                select.appendChild(opt);
            });

            showSuccess("Found " + data.length + " stream(s). Choose quality and press Start.");

        } catch (error) {
            select.innerHTML = "<option>Failed to load streams</option>";
            showError(error.message);
        } finally {
            loadBtn.innerText = 'Load';
            loadBtn.disabled = false;
        }
    }

    function startStreamingNow() {
        const selectedUrl = document.getElementById("qualities").value;

        if (!selectedUrl || selectedUrl.startsWith("--") || selectedUrl.startsWith("Failed") || selectedUrl.startsWith("Fetching")) {
            return alert("Please load a URL and select quality first!");
        }

        hideMessages();

        const video = document.getElementById("video");
        const container = document.getElementById("videoContainer");
        container.classList.remove("hidden");

        // تدمير الـ HLS القديم
        if (currentHls) {
            currentHls.destroy();
            currentHls = null;
        }

        // ✅ مسار Vercel الصح بشرطة واحدة
        const proxyUrl = "/api/get-video?stream=true&url=" + encodeURIComponent(selectedUrl);

        if (Hls.isSupported()) {
            currentHls = new Hls({
                maxBufferLength: 15,
                enableWorker: true,
                lowLatencyMode: false,
                xhrSetup: function(xhr) {
                    xhr.withCredentials = false;
                }
            });

            currentHls.loadSource(proxyUrl);
            currentHls.attachMedia(video);

            currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => showError("Autoplay blocked: " + e.message));
                showSuccess("Stream started successfully!");
            });

            currentHls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    showError("Fatal stream error: " + data.details);
                    currentHls.destroy();
                }
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari / iPhone native HLS
            video.src = proxyUrl;
            video.load();
            video.play().catch(e => showError("Playback error: " + e.message));
            showSuccess("Native HLS started.");
        } else {
            showError("Your browser does not support HLS playback.");
        }
    }

    // تشغيل بضغط Enter
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadVideo();
        });
    });
    </script>
</body>
</html>
